[workspace]
resolver = "2"
members = [
  "apps/cli",
  "crates/compatforge-bottle",
  "crates/compatforge-domain",
  "crates/compatforge-inspect",
  "crates/compatforge-guest-artifact",
  "crates/compatforge-capability",
  "crates/compatforge-storage",
  "crates/compatforge-runtime",
  "crates/compatforge-orchestrator",
  "crates/compatforge-process",
  "crates/compatforge-provider-linux",
  "crates/compatforge-provider-macos",
  "crates/compatforge-service",
  "crates/compatforge-ffi",
]
exclude = ["apps/desktop/src-tauri"]

[workspace.package]
version = "0.12.0"
edition = "2021"
rust-version = "1.78"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "deny"

[workspace.dependencies]
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10.9"

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Validate repository contracts
        run: python -B scripts/validate_repository.py
      - name: Test macOS headless preview contracts
        run: python -S -B -m unittest tests.test_macos_headless_preview -v
      - name: Test desktop GUI baseline contracts
        run: python -S -B -m unittest tests.test_gui_baseline_contracts -v
      - name: Test Mac-Win workflow policy contract
        run: python -S -B -m unittest tests.test_macwin_asset_migration.MacWinMigrationWorkflowTests.test_workflow_changes_only_pins_and_read_only_migration_checks -v
      - name: Test Bottle migration contracts and independent goldens
        run: python -S -B -m unittest tests.test_bottle_migration_contracts.BottleMigrationRepositoryTests tests.test_bottle_migration_contracts.BottleMigrationGoldenTests
      - name: Check portable Mac-Win assets
        run: python -B tools/convert_macwin_assets.py --check
      - name: Compile public C header
        run: cc -std=c11 -Wall -Wextra -Werror -x c -fsyntax-only -include crates/compatforge-ffi/include/compatforge.h /dev/null
      - name: Compile public C++ header
        run: c++ -std=c++17 -Wall -Wextra -Werror -x c++ -fsyntax-only -include crates/compatforge-ffi/include/compatforge.h /dev/null

  macos-dual-runtime-contracts:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Test dual-Runtime macOS acceptance contracts
        run: python -S -B -m unittest tests.test_macos_dual_runtime_acceptance -v

  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Check portable Mac-Win assets
        run: python -B tools/convert_macwin_assets.py --check
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check workspace
        run: cargo check --workspace --all-targets --locked
      - name: Build C ABI library
        run: cargo build -p compatforge-ffi --locked
      - name: Run ForgeOS dynamic C ABI fixture
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I crates/compatforge-ffi/include \
            tests/fixtures/forgeos_capabilities_consumer.c \
            -ldl -o target/forgeos-capabilities-consumer
          target/forgeos-capabilities-consumer \
            target/debug/libcompatforge_ffi.so \
            examples/context-config.linux-arm64.json
      - name: Run ForgeOS PE inspection C ABI fixture
        if: runner.os == 'Linux'
        run: |
          cc -std=c11 -Wall -Wextra -Werror \
            -I crates/compatforge-ffi/include \
            tests/fixtures/forgeos_inspection_consumer.c \
            -ldl -o target/forgeos-inspection-consumer
          target/forgeos-inspection-consumer \
            target/debug/libcompatforge_ffi.so \
            "$PWD/tests/fixtures/hello-x86_64.exe"
      - name: Run ForgeOS PreparedLaunch C ABI fixture
        if: runner.os == 'Linux'
        run: |
          sed "s#/var/lib/compatforge#$PWD/target/prepared-launch-store#g" \
            examples/context-config.linux-arm64.json \
            > target/prepared-launch-context.json
          cc -std=c11 -Wall -Wextra -Werror \
            -I crates/compatforge-ffi/include \
            tests/fixtures/forgeos_prepared_launch_consumer.c \
            -ldl -o target/forgeos-prepared-launch-consumer
          target/forgeos-prepared-launch-consumer \
            target/debug/libcompatforge_ffi.so \
            target/prepared-launch-context.json \
            "$PWD/tests/fixtures/hello-x86_64.exe"
      - name: Run ForgeOS application service C ABI fixture
        if: runner.os == 'Linux'
        run: |
          sed "s#/var/lib/compatforge#$PWD/target/service-storage#g" \
            examples/context-config.linux-arm64.json \
            > target/service-context.json
          cc -std=c11 -Wall -Wextra -Werror \
            -I crates/compatforge-ffi/include \
            tests/fixtures/forgeos_service_consumer.c \
            -ldl -o target/forgeos-service-consumer
          target/forgeos-service-consumer \
            target/debug/libcompatforge_ffi.so \
            target/service-context.json \
            "$PWD/target/service-state"
      - name: Run tests
        run: cargo test --workspace --locked
      - name: Install Runtime Pack fixture v1
        run: cargo run -p compatforge-cli --locked -- runtime install target/runtime-store tests/fixtures/runtime-packs/basic-v1 manifest.json
      - name: Install Runtime Pack fixture v2
        run: cargo run -p compatforge-cli --locked -- runtime install target/runtime-store tests/fixtures/runtime-packs/basic-v2 manifest.json
      - name: Verify Runtime Pack fixture v2
        run: cargo run -p compatforge-cli --locked -- runtime verify target/runtime-store sha256:b7e18e933c0a51f6f1ec387862793e5d22cc2edb7e23c114449ea98357d717af
      - name: Roll back Runtime Pack fixture
        run: cargo run -p compatforge-cli --locked -- runtime rollback target/runtime-store fixture-runtime
      - name: Run Bottle migration fixture sequence
        if: runner.os != 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          snapshot_receipt="$(cargo run -p compatforge-cli --locked -- bottle snapshot \
            target/bottle-store tests/fixtures/bottle-migration/win64
          )"
          test "$(python -c 'import json,sys; print(json.load(sys.stdin)["snapshotDigest"])' <<<"$snapshot_receipt")" = \
            "sha256:672021ed04ed3e53eff0df940e214bb580bb1690506440867666cd8370288c35"
          plan_receipt="$(cargo run -p compatforge-cli --locked -- bottle plan \
            target/bottle-store \
            sha256:672021ed04ed3e53eff0df940e214bb580bb1690506440867666cd8370288c35 \
            target/runtime-store tests/fixtures/bottle-migration/runtime-map.json
          )"
          test "$(python -c 'import json,sys; print(json.load(sys.stdin)["planDigest"])' <<<"$plan_receipt")" = \
            "sha256:ee984e0e15ba9707b8ff9c6a8ac745c6ecc60149d687ffdda5336cf797388dba"
          cargo run -p compatforge-cli --locked -- bottle import \
            target/bottle-store \
            sha256:672021ed04ed3e53eff0df940e214bb580bb1690506440867666cd8370288c35 \
            target/runtime-store tests/fixtures/bottle-migration/runtime-map.json
          cargo run -p compatforge-cli --locked -- bottle verify \
            target/bottle-store bottle-win64
          if cargo run -p compatforge-cli --locked -- bottle rollback \
            target/bottle-store bottle-win64; then
            echo "unexpected Bottle rollback success with no history" >&2
            exit 1
          fi
      - name: Check strict Bottle migration boundary on macOS
        if: runner.os == 'macOS'
        run: cargo test -p compatforge-bottle snapshot --locked
      - name: Compile example launch plan
        run: cargo run -p compatforge-cli --locked -- plan examples/context-config.linux-arm64.json examples/launch-request.json
      - name: Probe host capabilities
        run: cargo run -p compatforge-cli --locked -- probe
      - name: Verify and inspect PE fixture
        run: |
          python scripts/create_pe_fixture.py --check tests/fixtures/hello-x86_64.exe
          cargo run -p compatforge-cli --locked -- inspect tests/fixtures/hello-x86_64.exe
      - name: Build macOS x86_64 Provider fixture
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/macos-provider-fixture/materialized/bin
          clang -arch x86_64 -std=c11 -Wall -Wextra -Werror \
            tests/fixtures/macos_provider_stub.c \
            -o target/macos-provider-fixture/materialized/bin/wine
          cp target/macos-provider-fixture/materialized/bin/wine \
            target/macos-provider-fixture/materialized/bin/wineserver
          python3 scripts/create_macos_provider_fixture.py target/macos-provider-fixture
      - name: Install macOS Provider Runtime Pack fixture
        if: runner.os == 'macOS'
        run: cargo run -p compatforge-cli --locked -- runtime install target/macos-provider-fixture/store target/macos-provider-fixture/bundle manifest.json
      - name: Probe and compile macOS Provider context
        if: runner.os == 'macOS'
        run: |
          cargo run -p compatforge-cli --locked -- provider macos probe \
            target/macos-provider-fixture/provider.json \
            > target/macos-provider-fixture/probe.json
          cargo run -p compatforge-cli --locked -- provider macos context \
            target/macos-provider-fixture/provider.json \
            "$PWD/target/macos-provider-fixture/bottles" \
            > target/macos-provider-fixture/context.json
          cargo run -p compatforge-cli --locked -- plan \
            target/macos-provider-fixture/context.json \
            tests/fixtures/macos_launch_request.json \
            > target/macos-provider-fixture/plan.json
      - name: Launch and terminate through macOS Provider
        if: runner.os == 'macOS'
        run: |
          mkdir -p target/macos-provider-fixture/bottles/bottles/macos-provider-smoke
          cargo run -p compatforge-cli --locked -- launch-terminate \
            target/macos-provider-fixture/context.json \
            tests/fixtures/macos_launch_request.json 1000 \
            | tee target/macos-provider-fixture/events.jsonl
          grep -q 'COMPATFORGE_MACOS_PROVIDER_LAUNCH_OK' target/macos-provider-fixture/events.jsonl
          grep -q 'terminate-requested' target/macos-provider-fixture/events.jsonl
          grep -q '"kind":"exited"' target/macos-provider-fixture/events.jsonl
      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  desktop:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install locked desktop dependencies
        run: npm ci --prefix apps/desktop
      - name: Check and build TypeScript frontend
        run: npm run build --prefix apps/desktop
      - name: Check Tauri Rust formatting
        run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - name: Test Tauri Rust commands and state
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml --locked
      - name: Lint Tauri Rust commands
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - name: Build CompatForge.app
        run: npm run tauri --prefix apps/desktop -- build --bundles app
      - name: Run packaged Tauri smoke
        run: python -B apps/desktop/tests/smoke.py apps/desktop/src-tauri/target/release/bundle/macos/CompatForge.app/Contents/MacOS/CompatForge

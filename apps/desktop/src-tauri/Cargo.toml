[package]
name = "compatforge-desktop"
version = "0.12.0"
description = "CompatForge Tauri desktop shell"
edition = "2021"
rust-version = "1.78"
publish = false

[lib]
name = "compatforge_desktop"
crate-type = ["lib", "cdylib", "staticlib"]

[[bin]]
name = "CompatForge"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
monitor-sysinfo = { package = "sysinfo", version = "0.33", default-features = false, features = ["system"] }
compatforge-capability = { path = "../../../crates/compatforge-capability" }
compatforge-domain = { path = "../../../crates/compatforge-domain" }
compatforge-inspect = { path = "../../../crates/compatforge-inspect" }
compatforge-orchestrator = { path = "../../../crates/compatforge-orchestrator" }
compatforge-process = { path = "../../../crates/compatforge-process" }
compatforge-provider-macos = { path = "../../../crates/compatforge-provider-macos" }
compatforge-service = { path = "../../../crates/compatforge-service" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "=2.11.5", features = ["macos-private-api"] }
tauri-plugin-dialog = "=2.7.2"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "deny"
